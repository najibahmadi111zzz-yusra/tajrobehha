workflows:
  android-build:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:
      - name: Create Gradle Wrapper
        script: |
          cd app
          gradle wrapper --gradle-version 8.1.1

      - name: Build Android APK
        script: |
          cd app
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - app/app/build/outputs/apk/**/*.apk
