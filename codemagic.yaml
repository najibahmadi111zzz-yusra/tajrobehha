workflows:
  android-build:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Build Android APK
        script: |
          gradle wrapper
          mkdir -p app/gradle/wrapper
          cp gradle/wrapper/wrapper.jar app/gradle/wrapper/wrapper.jar
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk
