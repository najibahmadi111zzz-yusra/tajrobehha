workflows:
  android-build:
    name: Tajrobehha Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Build Android APK
        script: |
          set -e
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
