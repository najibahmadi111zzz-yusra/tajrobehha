workflows:
  android-build:
    name: Tajrobehha Android AAB
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - tajroba_release
      groups:
        - OPENROUTER

    scripts:
      - name: Prepare Gradle
        script: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Get SHA1 and SHA-256
        script: |
          mkdir -p ~/.android

          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          ./gradlew signingReport

      - name: Find AR dependency
        script: |
          echo "=========================================="
          echo "       SEARCHING AR DEPENDENCIES"
          echo "=========================================="

          ./gradlew app:dependencies \
            --configuration releaseRuntimeClasspath \
            | grep -i -E "arcore|com.google.ar|sceneform|filament|augmented" || true

          echo "=========================================="
          echo "       AR DEPENDENCY SEARCH FINISHED"
          echo "=========================================="

      - name: Build Android AAB
        script: |
          ./gradlew bundleRelease

    artifacts:
      - app/build/outputs/bundle/release/app-release.aab
